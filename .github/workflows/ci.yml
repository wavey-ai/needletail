name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: scripts/validate-product-boundary.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      - run: cargo run --locked --bin needletail-compile -- --program deploy/multicloud-qualification/relay-program.json
      - run: cargo fmt --manifest-path mission-control/Cargo.toml --all -- --check
      - run: cargo check --manifest-path mission-control/Cargo.toml --locked
      - run: cargo check --manifest-path mission-control/Cargo.toml --locked --target wasm32-unknown-unknown
      - run: cargo test --manifest-path mission-control/Cargo.toml --locked
      - run: cargo clippy --manifest-path mission-control/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path mission-control/Cargo.toml --locked --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-bindgen-cli --version '=0.2.121' --locked
      - run: mission-control/scripts/build.sh
      - name: Validate every tracked shell entry point
        run: |
          while IFS= read -r -d '' script; do
            [[ -e "${script}" ]] || continue
            case "$(head -n 1 "${script}")" in
              *bash|*'/sh') bash -n "${script}" ;;
            esac
          done < <(git ls-files -z scripts deploy mission-control/scripts)
      - name: Validate tracked Python and Node sources
        run: |
          while IFS= read -r -d '' script; do
            [[ -e "${script}" ]] || continue
            case "${script}" in
              *.py) python3 -m py_compile "${script}" ;;
              *.js|*.mjs) node --check "${script}" ;;
            esac
          done < <(git ls-files -z scripts player)
      - run: npm ci --prefix player --ignore-scripts
      - run: npm run check --prefix player
      - run: npm run build --prefix player
      - name: Run repository fixtures
        run: |
          for fixture in scripts/tests/*.sh; do
            "${fixture}"
          done
          for fixture in scripts/tests/*.py; do
            python3 "${fixture}"
          done
          node --test scripts/tests/*.test.mjs
      - run: scripts/realtime-benchmark.sh --help
      - run: scripts/realtime-qualification.sh --help
      - run: scripts/realtime-soak.sh --help
      - name: Install native observability validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes prometheus prometheus-alertmanager
      - run: scripts/validate-observability.sh
        env:
          NEEDLETAIL_OBSERVABILITY_REQUIRE_NATIVE_TOOLS: "1"

  reusable-crates-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
      - run: cargo test --locked --manifest-path crates/media-capability/Cargo.toml
      - run: cargo test --locked --manifest-path crates/capability-controller/Cargo.toml
