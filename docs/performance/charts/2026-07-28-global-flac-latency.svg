<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 900">
    <title id="title">Global FLAC UDP and LL-HLS latency over time</title>
    <desc id="description">Five aligned regional plots compare UDP with forward error correction against FLAC LL-HLS availability during one 600-second, eight-track test.</desc>

    <rect width="1200" height="900" fill="#08111f"/>
    <text x="94" y="44" fill="#f7fbff" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="600">Global FLAC latency over time</text>
    <text x="94" y="73" fill="#9fb1c7" font-size="16" font-family="Inter,Arial,sans-serif">Eight stereo tracks · 600 seconds · each point is a 10-second median of per-track, one-second P99 values</text>
    <line x1="94" y1="92" x2="128" y2="92" stroke="#55c2ff" stroke-width="4"/>
    <text x="138" y="97" fill="#d8e3ef" font-size="15" font-family="Inter,Arial,sans-serif">UDP with FEC</text>
    <line x1="284" y1="92" x2="318" y2="92" stroke="#ffb454" stroke-width="4"/>
    <text x="328" y="97" fill="#d8e3ef" font-size="15" font-family="Inter,Arial,sans-serif">FLAC LL-HLS availability</text>


